name: Module documentation

# Regenerates the module pages of npf-docs (docs/source/modules/*.md) from the
# %info and %variables of modules/*.npf with modules/generate_doc.py, and pushes
# them to tbarbette/npf-docs. Manual notes written in those pages below their
# NOTES marker are kept. Pull requests only check that the generation works.
#
# One-time setup, a deploy key with write access to npf-docs:
#   ssh-keygen -t ed25519 -N "" -C "npf module docs CI" -f npf-docs-key
#   gh repo deploy-key add npf-docs-key.pub --repo tbarbette/npf-docs --allow-write --title "NPF module docs CI"
#   gh secret set NPF_DOCS_DEPLOY_KEY --repo tbarbette/npf < npf-docs-key
#   rm npf-docs-key npf-docs-key.pub

on:
  push:
    branches: [ main ]
    paths:
      - 'modules/**'
      - '.github/workflows/module-docs.yml'
  pull_request:
    paths:
      - 'modules/**'
      - '.github/workflows/module-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  module-docs:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
    - name: Check the deploy key
      if: env.PUBLISH == 'true'
      env:
        KEY: ${{ secrets.NPF_DOCS_DEPLOY_KEY }}
      run: |
        if [ -z "$KEY" ] ; then
          echo "::error::The NPF_DOCS_DEPLOY_KEY secret is missing, see the setup at the top of .github/workflows/module-docs.yml"
          exit 1
        fi

    - uses: actions/checkout@v4
      with:
        path: npf

    - name: Check out npf-docs
      uses: actions/checkout@v4
      with:
        repository: tbarbette/npf-docs
        path: npf-docs
        ssh-key: ${{ env.PUBLISH == 'true' && secrets.NPF_DOCS_DEPLOY_KEY || '' }}

    - name: Generate the module pages
      run: python3 npf/modules/generate_doc.py --output npf-docs/docs/source/modules

    - name: Show the changes
      working-directory: npf-docs
      run: |
        git add -A docs/source/modules
        git diff --cached --stat | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Push to npf-docs
      if: env.PUBLISH == 'true'
      working-directory: npf-docs
      run: |
        if git diff --cached --quiet ; then
          echo "The module pages are up to date"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Update module pages from tbarbette/npf@${GITHUB_SHA::7}" -m "Generated by modules/generate_doc.py of NPF."
        branch=$(git rev-parse --abbrev-ref HEAD)
        git pull --rebase origin "$branch"
        git push origin "HEAD:$branch"
