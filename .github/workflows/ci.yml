name: Python application

on:
  push:
    branches: 
      - '*'
  pull_request:
    branches: [ master, main ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    -   name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
    -
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: false
          tags: tbarbette/npf:latest

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v2
      with:
        python-version: 3.13
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ hashFiles('setup.py') }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .         
        pip install pytest coverage
    - name: Version
      run: |
        npf --version
    - name: Compilation test
      run: |
        python -m compileall -q npf *.py
    - name: Unit test
      run: |
        coverage run -m unittest discover integration/unittests
        coverage report
        coverage xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
    - name: Run-time tests
      run: |
        ./integration/integration.sh

  # Same run-time tests, with DPDK: integration.sh then also runs the FastClick generator
  # (fastclick-play-single-mt) over DPDK's ring driver, which needs no NIC nor root
  generator:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: 3.13
    - name: Install DPDK
      run: |
        sudo apt-get update
        sudo apt-get install -y dpdk-dev libdpdk-dev libnuma-dev libsystemd-dev
        pkg-config --modversion libdpdk
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
    - name: Run-time tests with the generator
      run: |
        ./integration/integration.sh
