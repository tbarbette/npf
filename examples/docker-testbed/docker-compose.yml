# Small local testbed for examples/docker-web.npf, see README.md in this folder.
#
#   docker compose -f examples/docker-testbed/docker-compose.yml up -d --build
#   npf --test examples/docker-web.npf local --cluster client=docker://npf-client server=docker://npf-server
#
# NPF detects that the containers do not see the experiment folder and copies what it needs in them.
# Mounting the experiment folder at the same absolute path (volumes: ["$PWD:$PWD"]) is optional (shared mode).
services:
  client:
    build: .
    image: npf-node
    container_name: npf-client
    command: sleep infinity
    cap_add: [NET_ADMIN]       # tc netem to emulate the access link
  server:
    image: npf-node
    container_name: npf-server
    depends_on: [client]
